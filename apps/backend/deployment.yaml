apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: innodeploy

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
      annotations:
        image-version: "final-backend-fix"

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/hachemn/innodeploy-backend:55
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_URL

            - name: JENKINS_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JENKINS_URL

            - name: JENKINS_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JENKINS_USER

            - name: JENKINS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JENKINS_TOKEN

            - name: AWS_APP_DOMAIN
              value: "184.195.153.127.nip.io"

            - name: AWS_EC2_SSH_HOST
              value: "184.195.153.127"
