apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: innodeploy

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/hachemn/innodeploy-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
          env:
            - name: JWT_SECRET
            valueFrom:
             secretKeyRef:
               name: backend-secret
               key: JWT_SECRET
