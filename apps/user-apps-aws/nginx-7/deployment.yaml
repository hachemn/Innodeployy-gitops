apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-7
  namespace: user-apps
  labels:
    app: nginx-7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-7
  template:
    metadata:
      labels:
        app: nginx-7
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/hachemn/nginx-7:24
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
