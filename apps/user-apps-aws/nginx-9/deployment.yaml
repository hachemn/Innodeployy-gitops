apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-9
  namespace: user-apps
  labels:
    app: nginx-9
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-9
  template:
    metadata:
      labels:
        app: nginx-9
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/hachemn/nginx-9:29
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
