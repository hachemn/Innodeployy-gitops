apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: innodeploy-user-test-app-5
  namespace: user-apps
spec:
  ingressClassName: nginx
  rules:
    - host: user-app-5.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: innodeploy-user-test-app-5
                port:
                  number: 80
