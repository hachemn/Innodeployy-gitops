apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-detect-test
  namespace: user-apps
  labels:
    app: auto-detect-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-detect-test
  template:
    metadata:
      labels:
        app: auto-detect-test
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/hachemn/auto-detect-test:26
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
