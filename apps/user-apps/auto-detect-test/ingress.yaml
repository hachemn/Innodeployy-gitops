apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auto-detect-test
  namespace: user-apps
spec:
  ingressClassName: nginx
  rules:
    - host: user-app-test.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auto-detect-test
                port:
                  number: 80
