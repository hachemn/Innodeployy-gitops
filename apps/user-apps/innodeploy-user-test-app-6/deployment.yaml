apiVersion: apps/v1
kind: Deployment
metadata:
  name: innodeploy-user-test-app-6
  namespace: user-apps
  labels:
    app: innodeploy-user-test-app-6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: innodeploy-user-test-app-6
  template:
    metadata:
      labels:
        app: innodeploy-user-test-app-6
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/hachemn/innodeploy-user-test-app-6:3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
