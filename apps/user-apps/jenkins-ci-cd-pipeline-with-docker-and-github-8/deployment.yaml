apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-ci-cd-pipeline-with-docker-and-github-8
  namespace: user-apps
  labels:
    app: jenkins-ci-cd-pipeline-with-docker-and-github-8
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins-ci-cd-pipeline-with-docker-and-github-8
  template:
    metadata:
      labels:
        app: jenkins-ci-cd-pipeline-with-docker-and-github-8
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/hachemn/jenkins-ci-cd-pipeline-with-docker-and-github-8:27
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
