apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins-ci-cd-pipeline-with-docker-and-github-8
  namespace: user-apps
spec:
  ingressClassName: nginx
  rules:
    - host: user-app-8.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins-ci-cd-pipeline-with-docker-and-github-8
                port:
                  number: 80
